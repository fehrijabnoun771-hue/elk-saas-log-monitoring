<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>TaskFlow ELK Monitor v2.0</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:#f8fafc;margin:0;padding:20px}
nav{display:flex;gap:10px;margin-bottom:20px;border-bottom:1px solid #334155;padding-bottom:10px}
nav button{background:#1e293b;color:#f8fafc;border:1px solid #38bdf8;padding:8px 14px;border-radius:6px;cursor:pointer}
nav button.active{background:#38bdf8;color:#0f172a;font-weight:bold}
.page{display:none}.page.active{display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.card{background:#1e293b;padding:16px;border-radius:8px;border-left:4px solid #38bdf8}
.alert{background:#3f1219;border-left:4px solid #ef4444;padding:10px;margin:6px 0;border-radius:6px;display:flex;justify-content:space-between}
</style></head><body>
<h1>🚀 TaskFlow SaaS ELK Monitor v2.0 (34 KPI • 12 Logs • 8 Règles)</h1>
<nav>
  <button class="active" onclick="show('p1',this)">1. Dashboard 34 KPI</button>
  <button onclick="show('p2',this)">2. Upload Logs</button>
  <button onclick="show('p3',this)">3. Recherche & Filtres</button>
  <button onclick="show('p4',this)">4. Kibana & Rapports</button>
  <button onclick="show('p5',this)">5. Alertes DevOps (R1-R8)</button>
</nav>
<div id="p1" class="page active"><button onclick="loadAll()">🔄 Actualiser</button> <span id="meta" style="color:#38bdf8"></span><div id="kpis" class="grid" style="margin-top:15px"></div></div>
<div id="p2" class="page"><h2>📤 Upload de fichiers de logs (JSON / CSV)</h2><input type="file" id="f"><button onclick="up()">Envoyer vers Logstash</button><pre id="upres"></pre></div>
<div id="p3" class="page"><h2>🔍 Recherche de logs</h2><input id="q" placeholder="Mot-clé..."><select id="lvl"><option value="">Tous niveaux</option><option>ERROR</option><option>WARN</option><option>INFO</option></select><button onclick="searchLogs()">Rechercher</button><div id="logs"></div></div>
<div id="p4" class="page"><h2>📊 Dashboards Kibana & Métriques</h2><p>Accédez directement aux 5 dashboards analytiques Kibana : <a href="http://192.168.1.6:5601" target="_blank" style="color:#38bdf8">Ouvrir Kibana (Port 5601)</a></p></div>
<div id="p5" class="page"><h2>🚨 Alertes DevOps R1-R8 (Cycle de vie)</h2><div id="alerts"></div></div>
<script>
const H={"X-API-Key":"saas-devops-secret-2026"};
function show(id,b){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');b.classList.add('active');}
async function loadAll(){
  const k=await(await fetch("/api/v1/kpi/all",{headers:H})).json();
  document.getElementById("meta").innerText=`Source: ${k.source} | Rôle: ${k.role} | Total logs: ${k.total_logs}`;
  const fams=["performance","fiabilite","database","business","securite","infra_pipeline"];
  document.getElementById("kpis").innerHTML=fams.map(f=>`<div class="card"><h3>${f.toUpperCase()}</h3><pre>${JSON.stringify(k[f],null,2)}</pre></div>`).join("");
  const a=await(await fetch("/api/alerts",{headers:H})).json();
  document.getElementById("alerts").innerHTML=a.alerts.map(x=>`<div class="alert"><span><b>[${x.status}]</b> ${x.message}</span><span><button onclick="act('${x.id}','ack')">Acquitter</button> <button onclick="act('${x.id}','resolve')">Résoudre</button></span></div>`).join("");
}
async function act(id,a){await fetch(`/api/v1/alerts/${id}/${a}`,{method:"POST",headers:H});loadAll();}
async function searchLogs(){const r=await(await fetch(`/api/v1/logs?level=${document.getElementById("lvl").value}&q=${document.getElementById("q").value}`,{headers:H})).json();document.getElementById("logs").innerHTML=r.logs.slice(0,15).map(l=>`<div class="card" style="margin:6px 0"><b>[${l.log_type}]</b> (${l.level}) ${l.msg} — <i>${l.tenant_id}</i></div>`).join("");}
async function up(){const fd=new FormData();fd.append("file",document.getElementById("f").files);const r=await(await fetch("/api/v1/upload",{method:"POST",headers:H,body:fd})).json();document.getElementById("upres").innerText=JSON.stringify(r,null,2);}
loadAll();
</script></body></html>
