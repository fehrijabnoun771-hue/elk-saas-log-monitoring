<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><title>SaaS ELK DevOps Monitor</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:#f8fafc;margin:0;padding:20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:20px 0}
.card{background:#1e293b;padding:20px;border-radius:10px;border-left:4px solid #38bdf8}
.card h3{margin:0;font-size:14px;color:#94a3b8}.card p{font-size:26px;font-weight:bold;margin:10px 0 0}
.alert{background:#450a0a;border-left:4px solid #ef4444;padding:12px;margin:8px 0;border-radius:6px}
button{background:#38bdf8;color:#0f172a;border:none;padding:10px 18px;border-radius:6px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<h1>🚀 SaaS ELK DevOps Monitoring Dashboard</h1>
<button onclick="loadData()">🔄 Actualiser les KPIs & Alertes</button>
<span id="meta" style="margin-left:15px;color:#38bdf8"></span>
<div class="grid">
  <div class="card"><h3>Total Logs</h3><p id="total">-</p></div>
  <div class="card"><h3>Taux d'Erreur</h3><p id="err" style="color:#f87171">-</p></div>
  <div class="card"><h3>Latence Moyenne</h3><p id="avg">-</p></div>
  <div class="card" style="border-color:#ef4444"><h3>Alertes (> 3s)</h3><p id="slow" style="color:#ef4444">-</p></div>
</div>
<h2>🚨 Alertes Critiques DevOps (Temps de réponse > 3000 ms)</h2>
<div id="alerts"></div>
<script>
const H = {"X-API-Key": "saas-devops-secret-2026"};
async function loadData(){
  const k = await (await fetch("/api/kpis",{headers:H})).json();
  document.getElementById("total").innerText = k.total_logs;
  document.getElementById("err").innerText = k.error_rate_pct + " %";
  document.getElementById("avg").innerText = k.avg_response_time_ms + " ms";
  document.getElementById("slow").innerText = k.slow_requests_gt_3s;
  document.getElementById("meta").innerText = "Source: " + k.source + " (" + k.api_latency_ms + " ms)";
  const a = await (await fetch("/api/alerts",{headers:H})).json();
  document.getElementById("alerts").innerHTML = a.alerts.map(x => `<div class="alert"><b>[${x.severity}]</b> ${x.message} — <i>${x.detected_at}</i></div>`).join("");
}
loadData();
</script>
</body></html>
