name: SaaS ELK Monitoring CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile api/main.py scripts/generate_logs.py scripts/alert_worker.py tests/test_api.py
      - name: Validate Docker Compose
        run: cp .env.example .env && docker compose config -q
      - name: Build API Docker Image
        run: docker build -f api/Dockerfile -t saas-elk-api:ci .
