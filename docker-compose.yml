services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION}
    container_name: elk-elasticsearch
    environment:
      - cluster.name=saas-logs
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    mem_limit: 2g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -Eq 'green|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - elk-net

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION}
    container_name: elk-logstash
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      - XPACK_MONITORING_ENABLED=false
    mem_limit: 1g
    ports:
      - "5044:5044"
      - "9600:9600"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./data/logs:/data/logs
      - lsdata:/usr/share/logstash/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk-net

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION}
    container_name: elk-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - NODE_OPTIONS=--max-old-space-size=1024
    mem_limit: 1536m
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - elk-net

  mongodb:
    image: mongo:7
    container_name: elk-mongodb
    mem_limit: 512m
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - elk-net

  redis:
    image: redis:7-alpine
    container_name: elk-redis
    mem_limit: 256m
    ports:
      - "6379:6379"
    networks:
      - elk-net

volumes:
  esdata:
  lsdata:
  mongodata:

networks:
  elk-net:
    driver: bridge
