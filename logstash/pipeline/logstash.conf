input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  if ![log_type] {
    mutate { add_field => { "log_type" => "unknown" } }
  }
  if [response_time_ms] {
    mutate { convert => { "response_time_ms" => "float" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "saas-logs-%{log_type}-%{+YYYY.MM.dd}"
  }
}
