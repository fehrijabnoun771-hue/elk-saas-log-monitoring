input {
  tcp { port => 5044 codec => json_lines }
  file { path => "/data/uploads/*.json" start_position => "beginning" sincedb_path => "/dev/null" codec => "json" }
}
filter {
  if ![log_type] { mutate { add_field => { "log_type" => "unknown" } } }
  if ![tenant_id] { mutate { add_field => { "tenant_id" => "tenant-default" } } }
  if ![env] { mutate { add_field => { "env" => "prod" } } }
  if ![app_version] { mutate { add_field => { "app_version" => "2.0.0" } } }
  if [response_time_ms] { mutate { convert => { "response_time_ms" => "float" } } }
  if [duration_ms] { mutate { convert => { "duration_ms" => "float" } } }
  if [cpu_pct] { mutate { convert => { "cpu_pct" => "float" } } }
}
output {
  if "_jsonparsefailure" in [tags] or "_grokparsefailure" in [tags] {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "saas-logs-failed-%{+YYYY.MM.dd}" }
  } else {
    elasticsearch { hosts => ["http://elasticsearch:9200"] index => "saas-logs-%{log_type}-%{+YYYY.MM.dd}" }
  }
}
